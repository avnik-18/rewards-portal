# Python-ecosystem equivalent of the "husky" ask: same gate set, every commit.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      # Naming conventions: descriptive names per CLAUDE.md — PEP 8 shapes
      # (snake_case functions/vars, CapWords classes, UPPER_CASE constants),
      # no single-letter names outside the good-names list.
      - id: pylint-naming
        name: pylint (naming conventions)
        entry: pylint --disable=all --enable=invalid-name
        language: system
        types: [python]

      - id: mypy
        name: mypy (strict)
        entry: mypy app
        language: system
        types: [python]
        pass_filenames: false

      - id: bandit
        name: bandit (SAST)
        entry: bandit -r app
        language: system
        types: [python]
        pass_filenames: false

      - id: tests
        name: pytest
        entry: pytest -q
        language: system
        pass_filenames: false

      # Runs only if trivy is installed locally; CI runs it unconditionally.
      - id: trivy
        name: trivy (SCA)
        entry: trivy fs .
        language: system
        pass_filenames: false
        stages: [pre-commit]
