[project]
name = "rewards-portal-api"
version = "0.1.0"
description = "Rewards & Recognition portal backend (FastAPI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36,<2.1",
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "httpx>=0.28",
    "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "cryptography>=43.0",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "bandit>=1.8",
    "pylint>=3.3",
]

[tool.pylint]
# Naming-convention gate only: descriptive names, PEP 8 shapes. The rest of
# the quality gates (ruff/mypy/bandit) own their lanes — no overlap here.
disable = ["all"]
enable = ["invalid-name"]

[tool.pylint.basic]
good-names = ["i", "j", "k", "e", "id", "db", "_"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing --cov-report=json"

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "S607", "S608", "S108"]
"alembic/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
