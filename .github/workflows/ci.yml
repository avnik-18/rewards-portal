name: CI
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  gates:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recog
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d recog"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install
        run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check app tests
      - name: mypy strict
        run: mypy app
      - name: migrate (alembic head against the service DB)
        env:
          ENVIRONMENT: local
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/recog
        run: alembic upgrade head
      - name: pytest (unit + integrated, live DB)
        env:
          ENVIRONMENT: local
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/recog
          PG_CONTAINER: ""
        run: pytest tests/ --no-cov -q
      - name: db-verify (44 invariants, blocking)
        run: bash scripts/db-verify.sh
        env:
          # same asyncpg URL as migrate/pytest — the verify scripts read the
          # database through DATABASE_URL, never through docker exec
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/recog
